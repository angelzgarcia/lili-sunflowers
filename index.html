<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Ramo de Girasoles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #0a0d14;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    #ui {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(20, 24, 33, 0.78);
      border: 1px solid rgba(255, 214, 102, 0.22);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      color: #f5e6b8;
      font-size: 13px;
      z-index: 5000;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
    }

    .ui-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    @media (min-width: 900px) {
      #ui {
        left: 50%;
        right: auto;
        bottom: 20px;
        transform: translateX(-50%);
        grid-template-columns: auto auto auto;
        padding: 12px 18px;
        border-radius: 20px;
        gap: 16px;
        max-width: calc(100vw - 40px);
      }

      .ui-group {
        gap: 12px;
      }
    }

    #ui label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      user-select: none;
    }

    #ui input[type="range"] {
      width: 100px;
      accent-color: #ffb628;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      cursor: pointer;
    }

    #ui input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffb628;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 182, 40, 0.55);
      transition: transform 0.15s ease, background 0.4s ease;
    }

    #ui input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    #ui input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 0;
      background: #ffb628;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 182, 40, 0.55);
    }

    #ui button {
      appearance: none;
      border: 1px solid rgba(255, 214, 102, 0.35);
      background: rgba(255, 182, 40, 0.10);
      color: #ffdd80;
      padding: 8px 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease, color 0.4s ease;
      white-space: nowrap;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #ui button:hover {
      background: rgba(255, 182, 40, 0.22);
      border-color: rgba(255, 214, 102, 0.55);
    }

    #ui button:active {
      transform: translateY(1px);
    }

    #ui .theme-toggle {
      padding: 8px 12px;
      background: rgba(255, 214, 102, 0.14);
      border-color: rgba(255, 214, 102, 0.45);
    }

    #ui .theme-toggle .icon-sun,
    #ui .theme-toggle .icon-moon {
      transition: opacity 0.25s ease, transform 0.3s ease;
      display: block;
    }

    #ui .theme-toggle .icon-moon {
      display: none;
    }

    body.night #ui .theme-toggle .icon-sun {
      display: none;
    }

    body.night #ui .theme-toggle .icon-moon {
      display: block;
    }

    #ui .theme-toggle .theme-label {
      min-width: 3.2em;
      text-align: left;
    }

    #catalog {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
      flex-wrap: nowrap;
      max-width: 100%;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(to right, transparent 0, black 8px, black calc(100% - 8px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, black 8px, black calc(100% - 8px), transparent 100%);
    }

    #catalog::-webkit-scrollbar {
      display: none;
    }

    #catalog button {
      flex-shrink: 0;
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(255, 182, 40, 0.06);
      border: 1px solid rgba(255, 214, 102, 0.20);
      color: #ffdd80;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #catalog button:hover {
      background: rgba(255, 182, 40, 0.16);
      border-color: rgba(255, 214, 102, 0.40);
    }

    #catalog button.active {
      background: rgba(255, 182, 40, 0.30);
      border-color: rgba(255, 214, 102, 0.75);
      color: #fff5cf;
      box-shadow: 0 0 14px rgba(255, 182, 40, 0.25);
    }

    #catalog button .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    body.night #ui {
      background: rgba(12, 15, 25, 0.80);
      border-color: rgba(150, 180, 255, 0.22);
      color: #d0d8f0;
    }

    body.night #ui button {
      background: rgba(140, 160, 220, 0.10);
      border-color: rgba(150, 180, 255, 0.30);
      color: #c8d4f5;
    }

    body.night #ui button:hover {
      background: rgba(140, 160, 220, 0.22);
      border-color: rgba(150, 180, 255, 0.50);
    }

    body.night #catalog button {
      background: rgba(140, 160, 220, 0.06);
      border-color: rgba(150, 180, 255, 0.22);
      color: #c8d4f5;
    }

    body.night #catalog button.active {
      background: rgba(140, 160, 220, 0.28);
      border-color: rgba(150, 180, 255, 0.65);
      color: #e8eeff;
      box-shadow: 0 0 14px rgba(150, 180, 255, 0.25);
    }

    body.night #ui input[type="range"]::-webkit-slider-thumb {
      background: #a8b8e0;
      box-shadow: 0 0 10px rgba(150, 180, 255, 0.55);
    }

    body.night #ui input[type="range"]::-moz-range-thumb {
      background: #a8b8e0;
      box-shadow: 0 0 10px rgba(150, 180, 255, 0.55);
    }

    .val {
      font-variant-numeric: tabular-nums;
      min-width: 1.8ch;
      color: #fff5cf;
      font-weight: 700;
    }

    body.night .val {
      color: #e0e8ff;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-24px);
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(20, 24, 33, 0.92);
      color: #ffe9b0;
      border: 1px solid rgba(255, 214, 102, 0.32);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 6000;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============== NOTAS FLOTANTES ============== */

    .note {
      position: fixed;
      width: 220px;
      min-height: 130px;
      max-height: 340px;
      border-radius: 12px;
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.35),
        0 3px 8px rgba(0, 0, 0, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      user-select: none;
      font-family: inherit;
    }

    .note.dragging {
      box-shadow:
        0 20px 46px rgba(0, 0, 0, 0.45),
        0 6px 14px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      cursor: grabbing;
    }

    .note.shared {
      border-style: dashed !important;
      border-width: 2px !important;
    }

    .note.shared .note-textarea {
      cursor: not-allowed;
    }

    .note-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      cursor: grab;
      background: rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .note.dragging .note-header {
      cursor: grabbing;
    }

    .note-grip {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 3px 2px;
      color: currentColor;
      opacity: 0.35;
    }

    .note-grip span {
      display: block;
      width: 12px;
      height: 1.5px;
      background: currentColor;
      border-radius: 2px;
    }

    .note-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.12);
      color: currentColor;
      opacity: 0.70;
    }

    .note-colors {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .note-color {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, 0.25);
      cursor: pointer;
      padding: 0;
      background: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      outline: none;
      appearance: none;
    }

    .note-color:hover {
      transform: scale(1.20);
    }

    .note-color.active {
      box-shadow: 0 0 0 1.5px currentColor, 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .note-color.disabled {
      pointer-events: none;
      opacity: 0.45;
    }

    .note-close {
      appearance: none;
      border: none;
      background: transparent;
      color: currentColor;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
      opacity: 0.55;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      transition: opacity 0.15s ease, background 0.15s ease;
      font-family: inherit;
    }

    .note-close:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.10);
    }

    .note-body {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .note-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.42;
      color: currentColor;
      caret-color: currentColor;
      user-select: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.20) transparent;
    }

    .note-textarea::placeholder {
      color: currentColor;
      opacity: 0.42;
      font-style: italic;
    }

    .note-textarea::-webkit-scrollbar {
      width: 6px;
    }

    .note-textarea::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 3px;
    }

    .note-textarea::-webkit-scrollbar-track {
      background: transparent;
    }

    .note-footer {
      flex-shrink: 0;
      padding: 4px 10px 6px;
      font-size: 10px;
      letter-spacing: 0.02em;
      opacity: 0.55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* ============== BANNER DE NOTAS COMPARTIDAS ============== */

    #sharedBanner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 16px;
      border-radius: 14px;
      background: rgba(30, 40, 70, 0.92);
      border: 1px solid rgba(180, 210, 255, 0.40);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      color: #e8eeff;
      font-size: 13px;
      font-weight: 500;
      z-index: 5500;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: calc(100vw - 24px);
    }

    #sharedBanner.show {
      transform: translateX(-50%) translateY(0);
    }

    #sharedBanner .banner-icon {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(180, 210, 255, 0.20);
      color: #c8d8ff;
      flex-shrink: 0;
    }

    #sharedBanner .banner-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    #sharedBanner .banner-text strong {
      color: #ffffff;
    }

    #sharedBanner .banner-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    #sharedBanner button {
      appearance: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    #sharedBanner button.primary {
      background: #4a7bd8;
      color: #ffffff;
      border-color: #6b95e6;
    }

    #sharedBanner button.primary:hover {
      background: #5a8be8;
    }

    #sharedBanner button.ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #c8d8ff;
      border-color: rgba(200, 216, 255, 0.25);
    }

    #sharedBanner button.ghost:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #sharedBanner button:active {
      transform: translateY(1px);
    }

    @media (max-width: 480px) {
      #ui {
        padding: 8px 10px;
        border-radius: 14px;
        gap: 6px;
        bottom: 6px;
        left: 6px;
        right: 6px;
      }

      #ui button {
        padding: 7px 10px;
        font-size: 11.5px;
      }

      #ui input[type="range"] {
        width: 70px;
      }

      #catalog button {
        padding: 6px 10px;
        font-size: 11.5px;
      }

      .ui-group {
        gap: 6px;
      }

      .note {
        width: 190px;
      }

      #sharedBanner {
        flex-wrap: wrap;
        padding: 8px 10px;
        gap: 6px;
        font-size: 12px;
      }

      #sharedBanner .banner-text {
        font-size: 12px;
      }

      #sharedBanner button {
        padding: 5px 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="sharedBanner">
    <div class="banner-icon">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
        <polyline points="16 6 12 2 8 6" />
        <line x1="12" y1="2" x2="12" y2="15" />
      </svg>
    </div>
    <div class="banner-text" id="sharedBannerText">Notas compartidas</div>
    <div class="banner-actions">
      <button type="button" class="primary" id="importSharedBtn">Importar</button>
      <button type="button" class="ghost" id="dismissSharedBtn">Ocultar</button>
    </div>
  </div>

  <div id="ui">
    <div class="ui-group">
      <button id="themeToggle" class="theme-toggle" aria-label="Alternar día y noche">
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <span class="theme-label" id="themeLabel">Día</span>
      </button>
      <div id="catalog"></div>
    </div>

    <div class="ui-group">
      <label>Flores
        <input id="count" type="range" min="1" max="14" value="7" />
        <span class="val" id="countVal">7</span>
      </label>
      <label>Viento
        <input id="wind" type="range" min="0" max="3" step="0.1" value="1" />
        <span class="val" id="windVal">1.0</span>
      </label>
    </div>

    <div class="ui-group">
      <button id="addNote">+ Nota</button>
      <button id="regen">Rehacer</button>
      <button id="save">PNG</button>
      <button id="share">Compartir</button>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    (() => {
      'use strict';

      const TAU = Math.PI * 2;
      const PHI = (Math.sqrt(5) + 1) / 2;

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const countSlider = document.getElementById('count');
      const countVal = document.getElementById('countVal');
      const windSlider = document.getElementById('wind');
      const windVal = document.getElementById('windVal');
      const themeToggle = document.getElementById('themeToggle');
      const themeLabel = document.getElementById('themeLabel');
      const catalogEl = document.getElementById('catalog');
      const toast = document.getElementById('toast');
      const sharedBanner = document.getElementById('sharedBanner');
      const sharedBannerText = document.getElementById('sharedBannerText');
      const importSharedBtn = document.getElementById('importSharedBtn');
      const dismissSharedBtn = document.getElementById('dismissSharedBtn');

      let W = 0, H = 0, DPR = 1, S = 0;
      let time = 0;
      let seed = 424242;
      let flowers = [];
      let particles = [];
      let flowerCount = 7;
      let windStrength = 1;
      let currentType = 'girasol';

      let daySky = null;
      let nightSky = null;
      let isNight = false;
      let themeMix = 0;
      let themeTarget = 0;

      const STARS = [];
      const BIRDS = [
        { x: 0.18, y: 0.14, size: 0.0085 },
        { x: 0.30, y: 0.18, size: 0.0075 },
        { x: 0.12, y: 0.10, size: 0.0062 },
        { x: 0.44, y: 0.16, size: 0.0080 },
        { x: 0.56, y: 0.11, size: 0.0068 },
        { x: 0.38, y: 0.22, size: 0.0058 },
        { x: 0.62, y: 0.19, size: 0.0055 },
      ];

      const FLOWER_TYPES = {
        girasol: {
          label: 'Girasol',
          swatch: '#ffb628',
          base: { hue: 42, sat: 0.95, light: 0.55, petalR: 0.55, petalLen: 0.75, petalWid: 0.22 },
          layers: [
            { count: 16, rScale: 1.05, lenScale: 1.05, widScale: 1.10, hueShift: -6, satScale: 0.96, lightScale: 0.85, rotOffset: 0.00 },
            { count: 16, rScale: 1.00, lenScale: 1.00, widScale: 1.00, hueShift: 0, satScale: 1.00, lightScale: 1.00, rotOffset: 0.50 },
            { count: 12, rScale: 0.85, lenScale: 0.70, widScale: 0.85, hueShift: 10, satScale: 1.04, lightScale: 1.16, rotOffset: 0.00 },

          layers: [
            { count: 10, rScale: 1.20, lenScale: 1.15, widScale: 1.20, hueShift: -10, satScale: 0.90, lightScale: 0.72, rotOffset: 0.00 },
            { count: 10, rScale: 1.00, lenScale: 0.95, widScale: 1.00, hueShift: 0, satScale: 1.00, lightScale: 0.95, rotOffset: 0.50 },
            { count: 8, rScale: 0.75, lenScale: 0.70, widScale: 0.85, hueShift: 8, satScale: 1.02, lightScale: 1.10, rotOffset: 0.00 },
            { count: 6, rScale: 0.45, lenScale: 0.45, widScale: 0.70, hueShift: 14, satScale: 1.00, lightScale: 1.22, rotOffset: 0.30 },
          ],
          center: { ratio: 0.32, type: 'flat', hue: 342, sat: 0.55, light: 0.48 },
        },
        tulipan: {
          label: 'Tulipán',
          swatch: '#e0405a',
          base: { hue: 5, sat: 0.90, light: 0.60, petalR: 0.28, petalLen: 1.10, petalWid: 0.46 },
          layers: [
            { count: 5, rScale: 1.00, lenScale: 1.00, widScale: 1.00, hueShift: -6, satScale: 0.92, lightScale: 0.85, rotOffset: 0.00 },
            { count: 4, rScale: 0.75, lenScale: 1.10, widScale: 0.90, hueShift: 6, satScale: 1.05, lightScale: 1.08, rotOffset: 0.50 },
          ],
          center: { ratio: 0.25, type: 'flat', hue: 5, sat: 0.80, light: 0.45 },
        },
        margarita: {
          label: 'Margarita',
          swatch: '#f5f5e8',
          base: { hue: 52, sat: 0.10, light: 0.92, petalR: 0.42, petalLen: 0.72, petalWid: 0.17 },
          layers: [
            { count: 20, rScale: 1.00, lenScale: 1.00, widScale: 1.00, hueShift: 0, satScale: 1.00, lightScale: 0.96, rotOffset: 0.00 },
            { count: 16, rScale: 0.78, lenScale: 0.78, widScale: 0.85, hueShift: 4, satScale: 1.00, lightScale: 1.04, rotOffset: 0.50 },
          ],
          center: { ratio: 0.55, type: 'flat', hue: 48, sat: 0.95, light: 0.58 },
        },
        loto: {
          label: 'Loto',
          swatch: '#f0a0c0',
          base: { hue: 335, sat: 0.65, light: 0.72, petalR: 0.34, petalLen: 1.15, petalWid: 0.30 },
          layers: [
            { count: 12, rScale: 1.15, lenScale: 1.15, widScale: 1.00, hueShift: -8, satScale: 0.88, lightScale: 0.82, rotOffset: 0.00 },
            { count: 10, rScale: 0.95, lenScale: 0.95, widScale: 0.95, hueShift: 0, satScale: 1.00, lightScale: 0.96, rotOffset: 0.50 },
            { count: 8, rScale: 0.65, lenScale: 0.65, widScale: 0.80, hueShift: 10, satScale: 1.05, lightScale: 1.12, rotOffset: 0.00 },
          ],
          center: { ratio: 0.30, type: 'flat', hue: 50, sat: 0.90, light: 0.62 },
        },
        amapola: {
          label: 'Amapola',
          swatch: '#e03020',
          base: { hue: 8, sat: 0.95, light: 0.50, petalR: 0.22, petalLen: 1.35, petalWid: 0.55 },
          layers: [
            { count: 5, rScale: 1.00, lenScale: 1.00, widScale: 1.00, hueShift: -8, satScale: 0.92, lightScale: 0.82, rotOffset: 0.00 },
            { count: 5, rScale: 0.60, lenScale: 1.05, widScale: 0.92, hueShift: 6, satScale: 1.05, lightScale: 1.02, rotOffset: 0.50 },
          ],
          center: { ratio: 0.42, type: 'flat', hue: 25, sat: 0.35, light: 0.12 },
        },
      };

      function mulberry32(s) {
        return function () {
          s |= 0; s = (s + 0x6D2B79F5) | 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function hsl(h, s, l) {
        return `hsl(${h}, ${Math.max(0, Math.min(100, s * 100))}%, ${Math.max(0, Math.min(100, l * 100))}%)`;
      }

      function hsla(h, s, l, a) {
        return `hsla(${h}, ${Math.max(0, Math.min(100, s * 100))}%, ${Math.max(0, Math.min(100, l * 100))}%, ${a})`;
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        S = Math.min(W, H);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildSkies();
        buildStars();
        constrainNotesToViewport();
      }
      window.addEventListener('resize', resize);

      function buildStars() {
        STARS.length = 0;
        const count = Math.floor((W * H) / 9000);
        const starRng = mulberry32(12345);
        for (let i = 0; i < count; i++) {
          STARS.push({
            x: starRng() * W,
            y: starRng() * H * 0.75,
            r: 0.4 + starRng() * 1.4,
            phase: starRng() * TAU,
            speed: 1.2 + starRng() * 1.8,
            base: 0.45 + starRng() * 0.55,
          });
        }
      }

      function makeGradient(c, stops) {
        const g = c.createLinearGradient(0, 0, 0, H);
        for (const [p, col] of stops) g.addColorStop(p, col);
        return g;
      }

      function drawFluffyCloud(c, cx, cy, w, h, density, tone, cloudRng) {
        const puffs = Math.floor(8 + density * 10);
        for (let i = 0; i < puffs; i++) {
          const dx = (cloudRng() - 0.5) * w * 1.35;
          const dy = (cloudRng() - 0.5) * h * 0.75;
          const rx = w * (0.22 + cloudRng() * 0.35);
          const ry = h * (0.30 + cloudRng() * 0.40);
          const alpha = 0.30 + cloudRng() * 0.35;
          const grd = c.createRadialGradient(cx + dx, cy + dy, 0, cx + dx, cy + dy, rx);
          grd.addColorStop(0, `rgba(${tone[0]}, ${tone[1]}, ${tone[2]}, ${alpha})`);
          grd.addColorStop(0.55, `rgba(${tone[0]}, ${tone[1]}, ${tone[2]}, ${alpha * 0.55})`);
          grd.addColorStop(1, `rgba(${tone[0]}, ${tone[1]}, ${tone[2]}, 0)`);
          c.fillStyle = grd;
          c.beginPath();
          c.ellipse(cx + dx, cy + dy, rx, ry, 0, 0, TAU);
          c.fill();
        }
      }

      function drawBirdsInSky(c) {
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.strokeStyle = 'rgba(15, 12, 18, 0.72)';
        for (let i = 0; i < BIRDS.length; i++) {
          const b = BIRDS[i];
          const x = b.x * W;
          const y = b.y * H;
          const sz = b.size * S;
          const lw = Math.max(0.8, sz * 0.4);
          c.lineWidth = lw;
          c.beginPath();
          c.moveTo(x - sz * 1.30, y + sz * 0.65);
          c.quadraticCurveTo(x - sz * 0.55, y + sz * 0.08, x, y - sz * 0.06);
          c.quadraticCurveTo(x + sz * 0.55, y + sz * 0.08, x + sz * 1.30, y + sz * 0.65);
          c.stroke();
        }
      }

      function drawHills(c, color1, color2) {
        const amp = H * 0.045;
        c.fillStyle = color1;
        c.beginPath();
        c.moveTo(0, H);
        for (let x = 0; x <= W; x += 4) {
          const t = x / W;
          const y = H * 0.86
            - Math.sin(t * 3.2 + 0.8) * amp
            - Math.sin(t * 7.1 + 2.1) * amp * 0.5
            - Math.sin(t * 15.3 + 0.4) * amp * 0.22;
          c.lineTo(x, y);
        }
        c.lineTo(W, H);
        c.closePath();
        c.fill();

        c.fillStyle = color2;
        c.beginPath();
        c.moveTo(0, H);
        for (let x = 0; x <= W; x += 4) {
          const t = x / W;
          const y = H * 0.92
            - Math.sin(t * 2.1 + 3.4) * amp * 0.75
            - Math.sin(t * 5.7 + 0.2) * amp * 0.35
            - Math.sin(t * 13.1 + 1.7) * amp * 0.18;
          c.lineTo(x, y);
        }
        c.lineTo(W, H);
        c.closePath();
        c.fill();
      }

      function buildDaySky() {
        const c = document.createElement('canvas');
        c.width = Math.floor(W * DPR);
        c.height = Math.floor(H * DPR);
        const g = c.getContext('2d');
        g.scale(DPR, DPR);

        const skyGrad = makeGradient(g, [
          [0.00, '#2e4773'],
          [0.14, '#486aa0'],
          [0.32, '#8fa3c4'],
          [0.48, '#d9b89a'],
          [0.62, '#f0b878'],
          [0.76, '#e89a5e'],
          [0.88, '#c86a45'],
          [1.00, '#7a3a2a'],
        ]);
        g.fillStyle = skyGrad;
        g.fillRect(0, 0, W, H);

        const sunX = W * 0.20;
        const sunY = H * 0.30;

        const glowWide = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, S * 0.55);
        glowWide.addColorStop(0.00, 'rgba(255, 235, 180, 0.35)');
        glowWide.addColorStop(0.35, 'rgba(255, 210, 140, 0.18)');
        glowWide.addColorStop(0.70, 'rgba(255, 180, 100, 0.06)');
        glowWide.addColorStop(1.00, 'rgba(255, 160, 80, 0.00)');
        g.fillStyle = glowWide;
        g.fillRect(0, 0, W, H);

        const glowNear = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, S * 0.20);
        glowNear.addColorStop(0.00, 'rgba(255, 250, 220, 0.65)');
        glowNear.addColorStop(0.45, 'rgba(255, 230, 170, 0.35)');
        glowNear.addColorStop(1.00, 'rgba(255, 210, 130, 0.00)');
        g.fillStyle = glowNear;
        g.fillRect(0, 0, W, H);

        const discR = S * 0.055;
        const discGrad = g.createRadialGradient(
          sunX - discR * 0.30, sunY - discR * 0.30, discR * 0.10,
          sunX, sunY, discR
        );
        discGrad.addColorStop(0.00, '#fffdf0');
        discGrad.addColorStop(0.55, '#ffe9a8');
        discGrad.addColorStop(1.00, '#ffc45c');
        g.fillStyle = discGrad;
        g.beginPath();
        g.arc(sunX, sunY, discR, 0, TAU);
        g.fill();

        const cloudRng = mulberry32(20240101);
        const warmCloud = [255, 235, 210];
        const midCloud = [250, 225, 205];
        const lightBlueCloud = [230, 220, 220];

        drawFluffyCloud(g, W * 0.15, H * 0.72, S * 0.24, S * 0.045, 0.85, warmCloud, cloudRng);
        drawFluffyCloud(g, W * 0.32, H * 0.80, S * 0.32, S * 0.055, 0.75, warmCloud, cloudRng);
        drawFluffyCloud(g, W * 0.72, H * 0.70, S * 0.28, S * 0.048, 0.85, warmCloud, cloudRng);
        drawFluffyCloud(g, W * 0.88, H * 0.78, S * 0.24, S * 0.042, 0.75, midCloud, cloudRng);
        drawFluffyCloud(g, W * 0.50, H * 0.82, S * 0.40, S * 0.038, 0.55, midCloud, cloudRng);
        drawFluffyCloud(g, W * 0.06, H * 0.58, S * 0.20, S * 0.035, 0.45, lightBlueCloud, cloudRng);
        drawFluffyCloud(g, W * 0.96, H * 0.56, S * 0.18, S * 0.034, 0.45, lightBlueCloud, cloudRng);
        drawFluffyCloud(g, W * 0.42, H * 0.50, S * 0.34, S * 0.026, 0.30, lightBlueCloud, cloudRng);
        drawFluffyCloud(g, W * 0.68, H * 0.52, S * 0.28, S * 0.028, 0.32, lightBlueCloud, cloudRng);

        drawBirdsInSky(g);

        drawHills(g, 'rgba(40, 60, 55, 0.85)', 'rgba(20, 30, 32, 0.95)');

        const vig = g.createRadialGradient(
          W * 0.5, H * 0.45, Math.min(W, H) * 0.45,
          W * 0.5, H * 0.45, Math.max(W, H) * 0.85
        );
        vig.addColorStop(0.0, 'rgba(0,0,0,0)');
        vig.addColorStop(0.80, 'rgba(0,0,0,0.08)');
        vig.addColorStop(1.0, 'rgba(0,0,0,0.32)');
        g.fillStyle = vig;
        g.fillRect(0, 0, W, H);

        return c;
      }

      function buildNightSky() {
        const c = document.createElement('canvas');
        c.width = Math.floor(W * DPR);
        c.height = Math.floor(H * DPR);
        const g = c.getContext('2d');
        g.scale(DPR, DPR);

        const skyGrad = makeGradient(g, [
          [0.00, '#03050d'],
          [0.25, '#080e22'],
          [0.50, '#0f1530'],
          [0.72, '#1a1f42'],
          [0.88, '#252a52'],
          [1.00, '#161a3a'],
        ]);
        g.fillStyle = skyGrad;
        g.fillRect(0, 0, W, H);

        const moonX = W * 0.74;
        const moonY = H * 0.22;

        const glow1 = g.createRadialGradient(moonX, moonY, 0, moonX, moonY, S * 0.65);
        glow1.addColorStop(0.00, 'rgba(190, 210, 255, 0.32)');
        glow1.addColorStop(0.35, 'rgba(140, 170, 240, 0.14)');
        glow1.addColorStop(1.00, 'rgba(100, 140, 220, 0)');
        g.fillStyle = glow1;
        g.fillRect(0, 0, W, H);

        const discR = S * 0.042;
        const discGrad = g.createRadialGradient(
          moonX - discR * 0.3, moonY - discR * 0.3, discR * 0.1,
          moonX, moonY, discR
        );
        discGrad.addColorStop(0.00, '#f8fbff');
        discGrad.addColorStop(0.70, '#dce4f5');
        discGrad.addColorStop(1.00, '#a8b4d4');
        g.fillStyle = discGrad;
        g.beginPath();
        g.arc(moonX, moonY, discR, 0, TAU);
        g.fill();

        g.save();
        g.globalAlpha = 0.30;
        g.fillStyle = '#8090b4';
        const craters = [
          { x: 0.25, y: 0.15, r: 0.20 },
          { x: -0.30, y: 0.35, r: 0.16 },
          { x: -0.10, y: -0.40, r: 0.22 },
          { x: 0.40, y: -0.20, r: 0.13 },
          { x: 0.05, y: 0.55, r: 0.12 },
        ];
        for (const cr of craters) {
          g.beginPath();
          g.arc(moonX + cr.x * discR, moonY + cr.y * discR, cr.r * discR, 0, TAU);
          g.fill();
        }
        g.restore();

        const cloudRng = mulberry32(19870123);
        const toneNight = [70, 85, 130];
        const toneDeep = [45, 55, 95];

        drawFluffyCloud(g, W * 0.20, H * 0.74, S * 0.26, S * 0.045, 0.70, toneNight, cloudRng);
        drawFluffyCloud(g, W * 0.42, H * 0.82, S * 0.34, S * 0.052, 0.60, toneNight, cloudRng);
        drawFluffyCloud(g, W * 0.76, H * 0.72, S * 0.28, S * 0.045, 0.65, toneNight, cloudRng);
        drawFluffyCloud(g, W * 0.92, H * 0.80, S * 0.24, S * 0.040, 0.55, toneNight, cloudRng);
        drawFluffyCloud(g, W * 0.10, H * 0.60, S * 0.20, S * 0.032, 0.40, toneDeep, cloudRng);
        drawFluffyCloud(g, W * 0.60, H * 0.58, S * 0.30, S * 0.030, 0.35, toneDeep, cloudRng);

        drawHills(g, 'rgba(20, 22, 45, 0.95)', 'rgba(8, 10, 22, 1.0)');

        const vig = g.createRadialGradient(
          W * 0.5, H * 0.45, Math.min(W, H) * 0.35,
          W * 0.5, H * 0.45, Math.max(W, H) * 0.75
        );
        vig.addColorStop(0.0, 'rgba(0,0,0,0)');
        vig.addColorStop(0.70, 'rgba(0,0,0,0.20)');
        vig.addColorStop(1.0, 'rgba(0,0,0,0.62)');
        g.fillStyle = vig;
        g.fillRect(0, 0, W, H);

        return c;
      }

      function buildSkies() {
        daySky = buildDaySky();
        nightSky = buildNightSky();
      }

      function makeFlowers(n) {
        const cfg = FLOWER_TYPES[currentType] || FLOWER_TYPES.girasol;
        const r = mulberry32(seed);
        const list = [];
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? 0.5 : i / (n - 1);
          const centerBias = 1 - Math.abs(t - 0.5) * 2;
          const hueVar = (r() - 0.5) * 16;
          list.push({
            type: currentType,
            angle: (t - 0.5) * 1.15,
            size: 0.72 + r() * 0.28 + centerBias * 0.15,
            len: 0.42 + r() * 0.12 + centerBias * 0.1,
            phase: r() * TAU,
            swayAmp: 0.8 + r() * 0.6,
            petalHue: cfg.base.hue + hueVar,
            petalSat: cfg.base.sat * (0.96 + r() * 0.08),
            petalLight: cfg.base.light * (0.96 + r() * 0.08),
            petalCountExtra: Math.floor((r() - 0.5) * 4),
            seedCount: 150 + Math.floor(r() * 90),
            leafSeed: r(),
          });
        }
        return list;
      }

      function makeParticles(n) {
        const r = mulberry32((Date.now() ^ 0xBEEF) >>> 0);
        const list = [];
        for (let i = 0; i < n; i++) {
          list.push({
            x: r() * W, y: r() * H,
            vx: (r() - 0.5) * 0.15,
            vy: -0.05 - r() * 0.15,
            r: 0.6 + r() * 1.6,
            a: 0.15 + r() * 0.4,
            hue: 40 + r() * 20,
          });
        }
        return list;
      }

      function drawStem(x0, y0, x1, y1, phase) {
        const cx = (x0 + x1) / 2 + Math.sin(time * 0.7 + phase) * 18 * windStrength;
        const cy = (y0 + y1) / 2;
        const stroke = Math.max(4, W * 0.006);
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(cx, cy, x1, y1);
        ctx.strokeStyle = '#1e3a1a';
        ctx.lineWidth = stroke + 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(cx, cy, x1, y1);
        ctx.strokeStyle = '#3d6b2e';
        ctx.lineWidth = stroke;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0 - stroke * 0.15, y0);
        ctx.quadraticCurveTo(cx - stroke * 0.15, cy, x1 - stroke * 0.15, y1);
        ctx.strokeStyle = 'rgba(120, 180, 80, 0.5)';
        ctx.lineWidth = stroke * 0.35;
        ctx.stroke();

        return { cx, cy };
      }

      function bezierPoint(p0, p1, p2, t) {
        const u = 1 - t;
        return u * u * p0 + 2 * u * t * p1 + t * t * p2;
      }

      function drawLeaf(x, y, angle, size, flip) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        if (flip) ctx.scale(-1, 1);
        const len = size;
        const wid = size * 0.38;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(wid, -len * 0.3, wid, -len * 0.75, 0, -len);
        ctx.bezierCurveTo(-wid, -len * 0.75, -wid, -len * 0.3, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, -len);
        g.addColorStop(0, '#2a5220');
        g.addColorStop(0.5, '#4a8a36');
        g.addColorStop(1, '#6fb04a');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len * 0.9);
        ctx.strokeStyle = 'rgba(180, 220, 140, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }

      function drawPetals(cx, cy, r, count, len, wid, innerColor, outerColor, rot) {
        for (let i = 0; i < count; i++) {
          const a = (i / count) * TAU + rot;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.85);
          ctx.bezierCurveTo(wid, -r * 0.9, wid * 1.1, -(r + len * 0.85), 0, -(r + len));
          ctx.bezierCurveTo(-wid * 1.1, -(r + len * 0.85), -wid, -r * 0.9, 0, -r * 0.85);
          const g = ctx.createLinearGradient(0, -r, 0, -(r + len));
          g.addColorStop(0, innerColor);
          g.addColorStop(1, outerColor);
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawSeedsDisk(cx, cy, r, seedCount) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.08, 0, TAU);
        ctx.fillStyle = 'rgba(40, 20, 5, 0.6)';
        ctx.fill();

        const bg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
        bg.addColorStop(0, '#7a4a1a');
        bg.addColorStop(0.6, '#4a2a0e');
        bg.addColorStop(1, '#1e0f04');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = bg;
        ctx.fill();

        for (let i = 0; i < seedCount; i++) {
          const theta = (i * TAU) / PHI;
          const rr = Math.sqrt(i / seedCount) * r * 0.94;
          const x = cx + Math.cos(theta) * rr;
          const y = cy + Math.sin(theta) * rr;
          const s = (1 - rr / r) * 1.6 + 0.6;
          const sg = ctx.createRadialGradient(x - s * 0.3, y - s * 0.3, 0, x, y, s);
          sg.addColorStop(0, '#d99644');
          sg.addColorStop(0.6, '#8a5a22');
          sg.addColorStop(1, '#3a1e08');
          ctx.beginPath();
          ctx.arc(x, y, s, 0, TAU);
          ctx.fillStyle = sg;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        const rim = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
        rim.addColorStop(0, 'rgba(0,0,0,0)');
        rim.addColorStop(1, 'rgba(255, 180, 60, 0.35)');
        ctx.fillStyle = rim;
        ctx.fill();
      }

      function drawFlatDisk(cx, cy, r, hue, sat, light) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.10, 0, TAU);
        ctx.fillStyle = hsla(hue, sat * 1.05, light * 0.35, 0.55);
        ctx.fill();

        const bg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
        bg.addColorStop(0, hsl(hue + 5, sat * 0.85, Math.min(0.98, light * 1.18)));
        bg.addColorStop(0.55, hsl(hue, sat, light));
        bg.addColorStop(1, hsl(hue - 5, sat * 1.05, Math.max(0.10, light * 0.70)));
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = bg;
        ctx.fill();

        const dots = 10 + Math.floor(r * 0.6);
        for (let i = 0; i < dots; i++) {
          const theta = (i * TAU) / dots + 0.15;
          const rr = r * 0.55;
          const x = cx + Math.cos(theta) * rr;
          const y = cy + Math.sin(theta) * rr;
          ctx.beginPath();
          ctx.arc(x, y, r * 0.055, 0, TAU);
          ctx.fillStyle = hsla(hue - 8, sat * 1.05, Math.max(0.08, light * 0.55), 0.45);
          ctx.fill();
        }

        const rim = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
        rim.addColorStop(0, 'rgba(0,0,0,0)');
        rim.addColorStop(1, hsla(hue + 10, 0.95, 0.72, 0.35));
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = rim;
        ctx.fill();
      }

      function drawFlower(f, baseX, baseY) {
        const cfg = FLOWER_TYPES[f.type] || FLOWER_TYPES.girasol;
        const len = H * f.len;
        const size = Math.min(W, H) * 0.085 * f.size;
        const sway = Math.sin(time * 0.8 + f.phase) * 22 * windStrength * f.swayAmp;
        const headX = baseX + Math.sin(f.angle) * len * 0.55 + sway;
        const headY = baseY - len;

        const { cx: sCx, cy: sCy } = drawStem(baseX, baseY, headX, headY, f.phase);

        const t1 = 0.35 + f.leafSeed * 0.25;
        drawLeaf(
          bezierPoint(baseX, sCx, headX, t1),
          bezierPoint(baseY, sCy, headY, t1),
          Math.atan2(headY - baseY, headX - baseX) + Math.PI / 2 - 0.4,
          size * 1.4, false,
        );

        const t2 = 0.6 + f.leafSeed * 0.2;
        drawLeaf(
          bezierPoint(baseX, sCx, headX, t2),
          bezierPoint(baseY, sCy, headY, t2),
          Math.atan2(headY - baseY, headX - baseX) + Math.PI / 2 + 0.4,
          size * 1.1, true,
        );

        const petalR = size * cfg.base.petalR;
        const petalLen = size * cfg.base.petalLen;
        const petalWid = size * cfg.base.petalWid;

        for (let i = 0; i < cfg.layers.length; i++) {
          const layer = cfg.layers[i];
          const count = Math.max(3, layer.count + f.petalCountExtra);
          const rot = time * 0.05 + f.phase + layer.rotOffset * Math.PI;
          const innerColor = hsl(
            f.petalHue + layer.hueShift,
            Math.min(1, f.petalSat * layer.satScale),
            Math.min(0.98, f.petalLight * layer.lightScale)
          );
          const outerColor = hsl(
            f.petalHue + layer.hueShift - 4,
            Math.min(1, f.petalSat * layer.satScale * 1.02),
            Math.max(0.10, f.petalLight * layer.lightScale * 0.85)
          );
          drawPetals(
            headX, headY,
            petalR * layer.rScale,
            count,
            petalLen * layer.lenScale,
            petalWid * layer.widScale,
            innerColor, outerColor,
            rot
          );
        }

        if (cfg.center.type === 'seeds') {
          drawSeedsDisk(headX, headY, petalR * cfg.center.ratio, f.seedCount);
        } else {
          drawFlatDisk(
            headX, headY,
            petalR * cfg.center.ratio,
            cfg.center.hue, cfg.center.sat, cfg.center.light
          );
        }

        const gg = ctx.createRadialGradient(headX, headY, 0, headX, headY, petalR + petalLen * 1.2);
        gg.addColorStop(0, hsla(f.petalHue, 1.0, 0.75, 0.14));
        gg.addColorStop(1, hsla(f.petalHue, 1.0, 0.75, 0));
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gg;
        ctx.fillRect(
          headX - petalR - petalLen * 1.3,
          headY - petalR - petalLen * 1.3,
          (petalR + petalLen * 1.3) * 2,
          (petalR + petalLen * 1.3) * 2,
        );
        ctx.restore();
      }

      function drawBouquet() {
        const baseX = W / 2;
        const baseY = H + 40;
        const sorted = [...flowers].sort((a, b) => Math.abs(b.angle) - Math.abs(a.angle));
        for (const f of sorted) drawFlower(f, baseX, baseY);
      }

      function drawBackground() {
        if (!daySky || !nightSky) return;
        ctx.drawImage(daySky, 0, 0, W, H);
        if (themeMix > 0.001) {
          ctx.save();
          ctx.globalAlpha = themeMix;
          ctx.drawImage(nightSky, 0, 0, W, H);
          ctx.restore();
        }
      }

      function drawStarsOverlay() {
        if (themeMix < 0.05) return;
        ctx.save();
        ctx.globalAlpha = themeMix;
        for (const s of STARS) {
          const twinkle = 0.5 + 0.5 * Math.sin(time * s.speed + s.phase);
          const a = (0.35 + twinkle * 0.65) * s.base;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * (0.8 + twinkle * 0.4), 0, TAU);
          ctx.fillStyle = `rgba(220, 232, 255, ${a * 0.9})`;
          ctx.fill();
        }
        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          p.x += p.vx + Math.sin(time * 0.4 + p.y * 0.01) * 0.15;
          p.y += p.vy;
          if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${p.a})`;
          ctx.shadowColor = `hsla(${p.hue}, 90%, 60%, 0.9)`;
          ctx.shadowBlur = 6;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      let lastT = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastT) / 1000, 0.05);
        lastT = now;
        time += dt;

        if (Math.abs(themeTarget - themeMix) > 0.001) {
          themeMix += (themeTarget - themeMix) * Math.min(1, dt * 3.0);
          if (Math.abs(themeTarget - themeMix) < 0.005) themeMix = themeTarget;
        }

        drawBackground();
        drawStarsOverlay();
        drawParticles();
        drawBouquet();

        requestAnimationFrame(loop);
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      // ============================================================
      // NOTAS FLOTANTES
      // ============================================================

      const NOTES_KEY = 'tb-flower-notes';
      const NOTES_Z_BASE = 1000;

      const NOTE_COLORS = {
        amber: { bg: 'rgba(255, 216, 132, 0.94)', border: 'rgba(214, 158, 40, 0.55)', text: '#2a1e08', swatch: '#ffd884' },
        rose: { bg: 'rgba(255, 190, 205, 0.94)', border: 'rgba(200, 90, 130, 0.55)', text: '#3a0e1a', swatch: '#ffbecd' },
        mint: { bg: 'rgba(180, 240, 210, 0.94)', border: 'rgba(70, 165, 110, 0.55)', text: '#0e2a1a', swatch: '#b4f0d2' },
        sky: { bg: 'rgba(180, 220, 255, 0.94)', border: 'rgba(70, 140, 210, 0.55)', text: '#0e1a3a', swatch: '#b4dcff' },
        lilac: { bg: 'rgba(224, 200, 255, 0.94)', border: 'rgba(140, 100, 195, 0.55)', text: '#1e0e3a', swatch: '#e0c8ff' },
        cream: { bg: 'rgba(252, 244, 218, 0.94)', border: 'rgba(190, 160, 95, 0.55)', text: '#2a2010', swatch: '#fcf4da' },
      };

      let notes = [];
      let sharedNotes = [];
      let notesZCounter = NOTES_Z_BASE;
      let activeDrag = null;
      let sharedDismissed = false;

      function loadNotes() {
        try {
          const raw = localStorage.getItem(NOTES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              notes = parsed.filter((n) => n && typeof n === 'object' && typeof n.id === 'string');
            }
          }
        } catch {
          notes = [];
        }
        if (notes.length > 0) {
          const maxZ = Math.max(...notes.map((n) => Number(n.z) || NOTES_Z_BASE));
          notesZCounter = Math.max(NOTES_Z_BASE, maxZ);
        }
      }

      let saveNotesTimer = null;
      function saveNotes() {
        clearTimeout(saveNotesTimer);
        saveNotesTimer = setTimeout(() => {
          try {
            const payload = notes.map((n) => ({
              id: n.id,
              text: n.text || '',
              x: Math.round(n.x),
              y: Math.round(n.y),
              color: n.color || 'amber',
              z: Number(n.z) || NOTES_Z_BASE,
              createdAt: n.createdAt || Date.now(),
            }));
            localStorage.setItem(NOTES_KEY, JSON.stringify(payload));
          } catch {
            // silencioso
          }
        }, 200);
      }

      function createNoteElement(note) {
        const el = document.createElement('div');
        el.className = 'note' + (note.shared ? ' shared' : '');
        el.dataset.id = note.id;
        el.style.left = note.x + 'px';
        el.style.top = note.y + 'px';
        el.style.zIndex = String(note.z);
        applyNoteColor(el, note.color);

        const header = document.createElement('div');
        header.className = 'note-header';

        const grip = document.createElement('div');
        grip.className = 'note-grip';
        grip.innerHTML = '<span></span><span></span><span></span>';
        header.appendChild(grip);

        if (note.shared) {
          const badge = document.createElement('span');
          badge.className = 'note-badge';
          badge.textContent = 'Compartida';
          header.appendChild(badge);
        }

        const colorsWrap = document.createElement('div');
        colorsWrap.className = 'note-colors';
        for (const key of Object.keys(NOTE_COLORS)) {
          const sw = NOTE_COLORS[key];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'note-color' + (key === note.color ? ' active' : '') + (note.shared ? ' disabled' : '');
          btn.dataset.color = key;
          btn.style.background = sw.swatch;
          btn.style.color = sw.text;
          btn.title = key;
          if (!note.shared) {
            btn.addEventListener('pointerdown', (e) => e.stopPropagation());
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              note.color = key;
              applyNoteColor(el, key);
              colorsWrap.querySelectorAll('.note-color').forEach((b) => {
                b.classList.toggle('active', b.dataset.color === key);
              });
              saveNotes();
            });
          }
          colorsWrap.appendChild(btn);
        }
        header.appendChild(colorsWrap);

        if (!note.shared) {
          const closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'note-close';
          closeBtn.setAttribute('aria-label', 'Eliminar nota');
          closeBtn.textContent = '×';
          closeBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeNote(note.id);
          });
          header.appendChild(closeBtn);
        }

        el.appendChild(header);

        const body = document.createElement('div');
        body.className = 'note-body';
        const ta = document.createElement('textarea');
        ta.className = 'note-textarea';
        ta.value = note.text || '';
        ta.placeholder = note.shared ? 'Nota compartida' : 'Escribe algo...';
        ta.spellcheck = false;
        if (note.shared) {
          ta.readOnly = true;
          ta.tabIndex = -1;
        } else {
          ta.addEventListener('input', () => {
            note.text = ta.value;
            saveNotes();
          });
        }
        ta.addEventListener('pointerdown', (e) => e.stopPropagation());
        body.appendChild(ta);
        el.appendChild(body);

        const footer = document.createElement('div');
        footer.className = 'note-footer';
        const dateStr = new Date(note.createdAt || Date.now()).toLocaleDateString('es-MX', {
          day: '2-digit', month: 'short',
        });
        footer.innerHTML = `<span>${dateStr}</span><span class="note-counter">0</span>`;
        el.appendChild(footer);

        const counter = footer.querySelector('.note-counter');
        const updateCounter = () => {
          counter.textContent = String(ta.value.length);
        };
        ta.addEventListener('input', updateCounter);
        updateCounter();

        el.addEventListener('pointerdown', onNotePointerDown);
        el.addEventListener('pointermove', onNotePointerMove);
        el.addEventListener('pointerup', onNotePointerUp);
        el.addEventListener('pointercancel', onNotePointerUp);

        return el;
      }

      function applyNoteColor(el, colorKey) {
        const sw = NOTE_COLORS[colorKey] || NOTE_COLORS.amber;
        el.style.background = sw.bg;
        el.style.border = `1px solid ${sw.border}`;
        el.style.color = sw.text;
      }

      function renderNote(note) {
        const el = createNoteElement(note);
        document.body.appendChild(el);
        return el;
      }

      function renderAllNotes() {
        document.querySelectorAll('.note').forEach((n) => n.remove());
        for (const note of notes) {
          renderNote(note);
        }
        for (const note of sharedNotes) {
          renderNote(note);
        }
      }

      function getNoteById(id) {
        return notes.find((n) => n.id === id) || sharedNotes.find((n) => n.id === id) || null;
      }

      function findNoteElement(id) {
        return document.querySelector(`.note[data-id="${id}"]`);
      }

      function addNote() {
        const maxX = Math.max(20, window.innerWidth - 240);
        const maxY = Math.max(20, window.innerHeight - 200);
        const cx = Math.min(maxX, Math.max(20, window.innerWidth / 2 - 110 + (Math.random() - 0.5) * 90));
        const cy = Math.min(maxY, Math.max(20, window.innerHeight / 2 - 100 + (Math.random() - 0.5) * 90));

        const note = {
          id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          text: '',
          x: cx,
          y: cy,
          color: 'amber',
          z: ++notesZCounter,
          createdAt: Date.now(),
          shared: false,
        };
        notes.push(note);
        const el = renderNote(note);
        saveNotes();
        setTimeout(() => {
          const ta = el.querySelector('.note-textarea');
          if (ta) ta.focus();
        }, 40);
      }

      function removeNote(id) {
        notes = notes.filter((n) => n.id !== id);
        const el = findNoteElement(id);
        if (el) {
          el.style.transition = 'transform 0.18s ease, opacity 0.18s ease';
          el.style.transform = 'scale(0.92)';
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 180);
        }
        saveNotes();
      }

      function bringToFront(note) {
        note.z = ++notesZCounter;
        const el = findNoteElement(note.id);
        if (el) el.style.zIndex = String(note.z);
      }

      function onNotePointerDown(e) {
        const el = e.currentTarget;
        if (!(el instanceof HTMLElement)) return;
        if (e.target.closest('.note-close') || e.target.closest('.note-color')) return;
        if (e.target.tagName === 'TEXTAREA') {
          const id = el.dataset.id;
          const note = id ? getNoteById(id) : null;
          if (note) bringToFront(note);
          return;
        }

        const id = el.dataset.id;
        const note = id ? getNoteById(id) : null;
        if (!note) return;

        bringToFront(note);

        activeDrag = {
          note,
          el,
          startX: e.clientX,
          startY: e.clientY,
          origX: note.x,
          origY: note.y,
          pointerId: e.pointerId,
        };

        try { el.setPointerCapture(e.pointerId); } catch { }
        el.classList.add('dragging');
        e.preventDefault();
      }

      function onNotePointerMove(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
        const dx = e.clientX - activeDrag.startX;
        const dy = e.clientY - activeDrag.startY;
        const note = activeDrag.note;
        const maxX = Math.max(0, window.innerWidth - 80);
        const maxY = Math.max(0, window.innerHeight - 60);
        note.x = Math.max(-20, Math.min(maxX, activeDrag.origX + dx));
        note.y = Math.max(-10, Math.min(maxY, activeDrag.origY + dy));
        activeDrag.el.style.left = note.x + 'px';
        activeDrag.el.style.top = note.y + 'px';
      }

      function onNotePointerUp(e) {
        if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
        activeDrag.el.classList.remove('dragging');
        try { activeDrag.el.releasePointerCapture(e.pointerId); } catch { }
        activeDrag = null;
        saveNotes();
      }

      function constrainNotesToViewport() {
        const maxX = Math.max(20, window.innerWidth - 240);
        const maxY = Math.max(20, window.innerHeight - 200);
        for (const note of notes.concat(sharedNotes)) {
          note.x = Math.max(-20, Math.min(maxX, note.x));
          note.y = Math.max(-10, Math.min(maxY, note.y));
          const el = findNoteElement(note.id);
          if (el) {
            el.style.left = note.x + 'px';
            el.style.top = note.y + 'px';
          }
        }
      }

      // ============================================================
      // COMPRESIÓN / CODIFICACIÓN DE NOTAS EN URL
      // ============================================================

      function bytesToBase64Url(bytes) {
        let bin = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      function base64UrlToBytes(b64url) {
        const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        const bin = atob(b64 + pad);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function deflateRaw(data) {
        const cs = new CompressionStream('deflate-raw');
        const writer = cs.writable.getWriter();
        writer.write(data);
        writer.close();
        const chunks = [];
        const reader = cs.readable.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const totalLen = chunks.reduce((s, c) => s + c.length, 0);
        const out = new Uint8Array(totalLen);
        let off = 0;
        for (const c of chunks) { out.set(c, off); off += c.length; }
        return out;
      }

      async function inflateRaw(bytes) {
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const chunks = [];
        const reader = ds.readable.getReader();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const totalLen = chunks.reduce((s, c) => s + c.length, 0);
        const out = new Uint8Array(totalLen);
        let off = 0;
        for (const c of chunks) { out.set(c, off); off += c.length; }
        return out;
      }

      async function encodeNotesToPayload(noteList) {
        const compact = noteList.map((n) => [
          String(n.text || '').slice(0, 500),
          Math.round(Number(n.x) || 0),
          Math.round(Number(n.y) || 0),
          String(n.color || 'amber').slice(0, 10),
        ]);
        const json = JSON.stringify(compact);
        const data = new TextEncoder().encode(json);

        if (typeof CompressionStream !== 'undefined') {
          try {
            const compressed = await deflateRaw(data);
            if (compressed.length > 0) {
              return 'Z' + bytesToBase64Url(compressed);
            }
          } catch {
            // fallback
          }
        }
        return 'R' + bytesToBase64Url(data);
      }

      async function decodeNotesFromPayload(payload) {
        if (!payload || payload.length < 2) return null;
        const marker = payload[0];
        const body = payload.slice(1);

        let json = null;

        if (marker === 'Z') {
          if (typeof DecompressionStream === 'undefined') return null;
          try {
            const compressed = base64UrlToBytes(body);
            const decompressed = await inflateRaw(compressed);
            json = new TextDecoder().decode(decompressed);
          } catch {
            return null;
          }
        } else if (marker === 'R') {
          try {
            const bytes = base64UrlToBytes(body);
            json = new TextDecoder().decode(bytes);
          } catch {
            return null;
          }
        } else {
          return null;
        }

        try {
          const compact = JSON.parse(json);
          if (!Array.isArray(compact)) return null;
          return compact
            .filter((item) => Array.isArray(item) && item.length >= 4)
            .map((item, i) => ({
              id: 's_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
              text: String(item[0] || ''),
              x: Number(item[1]) || 20,
              y: Number(item[2]) || 20,
              color: NOTE_COLORS[String(item[3])] ? String(item[3]) : 'amber',
              z: NOTES_Z_BASE + 500 + i,
              createdAt: Date.now(),
              shared: true,
            }));
        } catch {
          return null;
        }
      }

      // ============================================================
      // BANNER DE NOTAS COMPARTIDAS
      // ============================================================

      function updateSharedBanner() {
        const count = sharedNotes.length;
        if (count === 0 || sharedDismissed) {
          sharedBanner.classList.remove('show');
          return;
        }
        sharedBannerText.innerHTML = `<strong>${count}</strong> nota${count === 1 ? '' : 's'} compartida${count === 1 ? '' : 's'} en este link`;
        sharedBanner.classList.add('show');
      }

      importSharedBtn.addEventListener('click', () => {
        if (sharedNotes.length === 0) return;
        const imported = sharedNotes.map((n) => ({
          id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          text: n.text,
          x: n.x,
          y: n.y,
          color: n.color,
          z: ++notesZCounter,
          createdAt: Date.now(),
          shared: false,
        }));
        notes = notes.concat(imported);
        sharedNotes = [];
        saveNotes();
        renderAllNotes();
        updateSharedBanner();
        clearNotesFromHash();
        showToast(`${imported.length} nota${imported.length === 1 ? '' : 's'} importada${imported.length === 1 ? '' : 's'}`);
      });

      dismissSharedBtn.addEventListener('click', () => {
        sharedDismissed = true;
        updateSharedBanner();
      });

      function clearNotesFromHash() {
        const hash = location.hash.replace(/^#/, '');
        if (!hash) return;
        const p = new URLSearchParams(hash);
        if (p.has('notes')) {
          p.delete('notes');
          const next = p.toString();
          const base = location.pathname + location.search;
          history.replaceState(null, '', next ? `${base}#${next}` : base);
        }
      }

      // ============================================================
      // UI
      // ============================================================

      function buildCatalog() {
        catalogEl.innerHTML = '';
        for (const key in FLOWER_TYPES) {
          const type = FLOWER_TYPES[key];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.type = key;
          btn.innerHTML = `<span class="dot" style="background:${type.swatch}"></span>${type.label}`;
          if (key === currentType) btn.classList.add('active');
          btn.addEventListener('click', () => {
            if (currentType === key) return;
            currentType = key;
            catalogEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            flowers = makeFlowers(flowerCount);
            showToast(type.label);
          });
          catalogEl.appendChild(btn);
        }
      }

      function applyState(n, w, night, type) {
        flowerCount = n;
        windStrength = w;
        isNight = night;
        currentType = FLOWER_TYPES[type] ? type : 'girasol';
        themeTarget = night ? 1 : 0;
        themeMix = night ? 1 : 0;
        countSlider.value = String(n);
        windSlider.value = String(w);
        countVal.textContent = String(n);
        windVal.textContent = w.toFixed(1);
        document.body.classList.toggle('night', night);
        themeLabel.textContent = night ? 'Noche' : 'Día';
        buildCatalog();
        flowers = makeFlowers(n);
      }

      countSlider.addEventListener('input', () => {
        const n = parseInt(countSlider.value, 10);
        countVal.textContent = String(n);
        flowerCount = n;
        flowers = makeFlowers(n);
      });

      windSlider.addEventListener('input', () => {
        const w = parseFloat(windSlider.value);
        windVal.textContent = w.toFixed(1);
        windStrength = w;
      });

      themeToggle.addEventListener('click', () => {
        isNight = !isNight;
        themeTarget = isNight ? 1 : 0;
        document.body.classList.toggle('night', isNight);
        themeLabel.textContent = isNight ? 'Noche' : 'Día';
        showToast(isNight ? 'Modo noche' : 'Modo día');
      });

      document.getElementById('addNote').addEventListener('click', () => {
        addNote();
        showToast('Nota agregada');
      });

      document.getElementById('regen').addEventListener('click', () => {
        seed = (Math.random() * 0xFFFFFFF) >>> 0;
        flowers = makeFlowers(flowerCount);
        particles = makeParticles(60);
        showToast('Nuevo ramo');
      });

      document.getElementById('save').addEventListener('click', () => {
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ramo-${currentType}-${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast('Imagen descargada');
        }, 'image/png');
      });

      document.getElementById('share').addEventListener('click', async () => {
        const allNotes = notes.concat(sharedNotes);
        const params = new URLSearchParams({
          n: String(flowerCount),
          w: String(windStrength),
          t: isNight ? 'night' : 'day',
          f: currentType,
        });

        if (allNotes.length > 0) {
          try {
            const payload = await encodeNotesToPayload(allNotes);
            params.set('notes', payload);
          } catch {
            // sin notas si falla la codificación
          }
        }

        const url = `${location.origin}${location.pathname}#${params.toString()}`;

        if (url.length > 8000) {
          showToast('Link muy largo, considera menos notas');
        }

        try {
          if (navigator.share) {
            await navigator.share({
              title: 'Ramo con notas',
              text: allNotes.length > 0 ? `${allNotes.length} nota${allNotes.length === 1 ? '' : 's'} para ti` : 'Ramo',
              url,
            });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(url);
            showToast(allNotes.length > 0 ? `Link con ${allNotes.length} nota${allNotes.length === 1 ? '' : 's'} copiado` : 'Link copiado');
          } else {
            showToast('Link: ' + url);
          }
        } catch {
          try {
            await navigator.clipboard.writeText(url);
            showToast('Link copiado');
          } catch {
            showToast('No se pudo compartir');
          }
        }
      });

      function parseHashParams() {
        const hash = location.hash.replace(/^#/, '');
        if (!hash) return null;
        return new URLSearchParams(hash);
      }

      // ============================================================
      // BOOT
      // ============================================================

      async function boot() {
        loadNotes();
        resize();

        const p = parseHashParams();
        let initialNotesPayload = null;

        let n = 7, w = 1.0, night = false, type = 'girasol';

        if (p) {
          const nv = parseInt(p.get('n') || '', 10);
          const wv = parseFloat(p.get('w') || '');
          const tv = p.get('t') || 'day';
          const fv = p.get('f') || 'girasol';
          if (Number.isFinite(nv) && nv >= 1 && nv <= 14) n = nv;
          if (Number.isFinite(wv) && wv >= 0 && wv <= 3) w = wv;
          night = tv === 'night';
          if (FLOWER_TYPES[fv]) type = fv;
          initialNotesPayload = p.get('notes');
        }

        applyState(n, w, night, type);
        particles = makeParticles(60);

        if (initialNotesPayload) {
          try {
            const decoded = await decodeNotesFromPayload(initialNotesPayload);
            if (decoded && decoded.length > 0) {
              sharedNotes = decoded;
            }
          } catch {
            // silencioso
          }
        }

        renderAllNotes();
        updateSharedBanner();

        requestAnimationFrame(loop);
      }

      boot();
    })();
  </script>
</body>

</html>
