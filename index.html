<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Ramo de Girasoles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #0a0d14;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    #ui {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(20, 24, 33, 0.72);
      border: 1px solid rgba(255, 214, 102, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      color: #f5e6b8;
      font-size: 13px;
      z-index: 10;
      max-width: calc(100vw - 24px);
    }

    #ui label {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #ui input[type="range"] {
      width: 110px;
      accent-color: #ffb628;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    #ui input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffb628;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 182, 40, 0.6);
    }

    #ui input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 0;
      background: #ffb628;
      cursor: pointer;
    }

    #ui button {
      appearance: none;
      border: 1px solid rgba(255, 214, 102, 0.4);
      background: rgba(255, 182, 40, 0.12);
      color: #ffdd80;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    #ui button:hover {
      background: rgba(255, 182, 40, 0.24);
      transform: translateY(-1px);
    }

    #ui button:active {
      transform: translateY(0);
    }

    .val {
      font-variant-numeric: tabular-nums;
      min-width: 1.6ch;
      color: #fff5cf;
      font-weight: 700;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(20, 24, 33, 0.9);
      color: #ffe9b0;
      border: 1px solid rgba(255, 214, 102, 0.35);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 20;
      font-size: 13px;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 560px) {
      #ui {
        gap: 8px;
        padding: 10px 12px;
        font-size: 12px;
        bottom: 10px;
      }

      #ui input[type="range"] {
        width: 70px;
      }

      #ui button {
        padding: 7px 11px;
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>
  <canvas id="scene"></canvas>
  <div id="ui">
    <label>Flores <input id="count" type="range" min="1" max="12" value="5" /><span class="val"
        id="countVal">5</span></label>
    <label>Viento <input id="wind" type="range" min="0" max="3" step="0.1" value="1" /><span class="val"
        id="windVal">1.0</span></label>
    <button id="regen">Rehacer</button>
    <button id="save">PNG</button>
    <button id="share">Compartir</button>
  </div>
  <div id="toast"></div>

  <script>
    (() => {
      'use strict';
      const TAU = Math.PI * 2;
      const PHI = (Math.sqrt(5) + 1) / 2;

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const countSlider = document.getElementById('count');
      const countVal = document.getElementById('countVal');
      const windSlider = document.getElementById('wind');
      const windVal = document.getElementById('windVal');
      const toast = document.getElementById('toast');

      let W = 0, H = 0, DPR = 1;
      let time = 0;
      let rng = mulberry32(Date.now() >>> 0);
      let flowers = [];
      let particles = [];
      let flowerCount = 5;
      let windStrength = 1;

      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          let t = seed;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener('resize', resize);

      function makeFlowers(n) {
        const list = [];
        for (let i = 0; i < n; i++) {
          const t = n === 1 ? 0.5 : i / (n - 1);
          const centerBias = 1 - Math.abs(t - 0.5) * 2;
          list.push({
            angle: (t - 0.5) * 1.15,
            size: 0.72 + rng() * 0.28 + centerBias * 0.15,
            len: 0.42 + rng() * 0.12 + centerBias * 0.1,
            phase: rng() * TAU,
            swayAmp: 0.8 + rng() * 0.6,
            petalHue: 36 + rng() * 14,
            petalCount: 16 + Math.floor(rng() * 6),
            seedCount: 150 + Math.floor(rng() * 90),
            leafSeed: rng(),
          });
        }
        return list;
      }

      function makeParticles(n) {
        const list = [];
        for (let i = 0; i < n; i++) {
          list.push({
            x: rng() * W, y: rng() * H,
            vx: (rng() - 0.5) * 0.15,
            vy: -0.05 - rng() * 0.15,
            r: 0.6 + rng() * 1.6,
            a: 0.15 + rng() * 0.4,
            hue: 40 + rng() * 20,
          });
        }
        return list;
      }

      function drawBackground() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#1a1f2e');
        g.addColorStop(0.5, '#0f1419');
        g.addColorStop(1, '#05070a');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        const cx = W / 2, cy = H * 0.45;
        const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
        rg.addColorStop(0, 'rgba(255, 180, 60, 0.10)');
        rg.addColorStop(0.4, 'rgba(255, 120, 40, 0.04)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);
      }

      function drawParticles() {
        for (const p of particles) {
          p.x += p.vx + Math.sin(time * 0.4 + p.y * 0.01) * 0.15;
          p.y += p.vy;
          if (p.y < -10) { p.y = H + 10; p.x = rng() * W; }
          if (p.x < -10) p.x = W + 10;
          if (p.x > W + 10) p.x = -10;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${p.a})`;
          ctx.shadowColor = `hsla(${p.hue}, 90%, 60%, 0.9)`;
          ctx.shadowBlur = 6;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      function drawStem(x0, y0, x1, y1, phase) {
        const cx = (x0 + x1) / 2 + Math.sin(time * 0.7 + phase) * 18 * windStrength;
        const cy = (y0 + y1) / 2;
        const stroke = Math.max(4, W * 0.006);
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(cx, cy, x1, y1);
        ctx.strokeStyle = '#1e3a1a';
        ctx.lineWidth = stroke + 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(cx, cy, x1, y1);
        ctx.strokeStyle = '#3d6b2e';
        ctx.lineWidth = stroke;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0 - stroke * 0.15, y0);
        ctx.quadraticCurveTo(cx - stroke * 0.15, cy, x1 - stroke * 0.15, y1);
        ctx.strokeStyle = 'rgba(120, 180, 80, 0.5)';
        ctx.lineWidth = stroke * 0.35;
        ctx.stroke();

        return { cx, cy };
      }

      function bezierPoint(p0, p1, p2, t) {
        const u = 1 - t;
        return u * u * p0 + 2 * u * t * p1 + t * t * p2;
      }

      function drawLeaf(x, y, angle, size, flip) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        if (flip) ctx.scale(-1, 1);
        const len = size;
        const wid = size * 0.38;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(wid, -len * 0.3, wid, -len * 0.75, 0, -len);
        ctx.bezierCurveTo(-wid, -len * 0.75, -wid, -len * 0.3, 0, 0);
        const g = ctx.createLinearGradient(0, 0, 0, -len);
        g.addColorStop(0, '#2a5220');
        g.addColorStop(0.5, '#4a8a36');
        g.addColorStop(1, '#6fb04a');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -len * 0.9);
        ctx.strokeStyle = 'rgba(180, 220, 140, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }

      function drawPetals(cx, cy, r, count, len, wid, innerColor, outerColor, rot) {
        for (let i = 0; i < count; i++) {
          const a = (i / count) * TAU + rot;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.85);
          ctx.bezierCurveTo(wid, -r * 0.9, wid * 1.1, -(r + len * 0.85), 0, -(r + len));
          ctx.bezierCurveTo(-wid * 1.1, -(r + len * 0.85), -wid, -r * 0.9, 0, -r * 0.85);
          const g = ctx.createLinearGradient(0, -r, 0, -(r + len));
          g.addColorStop(0, innerColor);
          g.addColorStop(1, outerColor);
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawDisk(cx, cy, r, seedCount) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.08, 0, TAU);
        ctx.fillStyle = 'rgba(40, 20, 5, 0.6)';
        ctx.fill();

        const bg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
        bg.addColorStop(0, '#7a4a1a');
        bg.addColorStop(0.6, '#4a2a0e');
        bg.addColorStop(1, '#1e0f04');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        ctx.fillStyle = bg;
        ctx.fill();

        for (let i = 0; i < seedCount; i++) {
          const theta = (i * TAU) / PHI;
          const rr = Math.sqrt(i / seedCount) * r * 0.94;
          const x = cx + Math.cos(theta) * rr;
          const y = cy + Math.sin(theta) * rr;
          const s = (1 - rr / r) * 1.6 + 0.6;
          const sg = ctx.createRadialGradient(x - s * 0.3, y - s * 0.3, 0, x, y, s);
          sg.addColorStop(0, '#d99644');
          sg.addColorStop(0.6, '#8a5a22');
          sg.addColorStop(1, '#3a1e08');
          ctx.beginPath();
          ctx.arc(x, y, s, 0, TAU);
          ctx.fillStyle = sg;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, TAU);
        const rim = ctx.createRadialGradient(cx, cy, r * 0.7, cx, cy, r);
        rim.addColorStop(0, 'rgba(0,0,0,0)');
        rim.addColorStop(1, 'rgba(255, 180, 60, 0.35)');
        ctx.fillStyle = rim;
        ctx.fill();
      }

      function drawFlower(f, baseX, baseY) {
        const len = H * f.len;
        const size = Math.min(W, H) * 0.085 * f.size;
        const sway = Math.sin(time * 0.8 + f.phase) * 22 * windStrength * f.swayAmp;
        const headX = baseX + Math.sin(f.angle) * len * 0.55 + sway;
        const headY = baseY - len;

        const { cx: sCx, cy: sCy } = drawStem(baseX, baseY, headX, headY, f.phase);

        const t1 = 0.35 + f.leafSeed * 0.25;
        drawLeaf(
          bezierPoint(baseX, sCx, headX, t1),
          bezierPoint(baseY, sCy, headY, t1),
          Math.atan2(headY - baseY, headX - baseX) + Math.PI / 2 - 0.4,
          size * 1.4, false,
        );

        const t2 = 0.6 + f.leafSeed * 0.2;
        drawLeaf(
          bezierPoint(baseX, sCx, headX, t2),
          bezierPoint(baseY, sCy, headY, t2),
          Math.atan2(headY - baseY, headX - baseX) + Math.PI / 2 + 0.4,
          size * 1.1, true,
        );

        const petalR = size * 0.55;
        const petalLen = size * 0.75;
        const petalWid = size * 0.22;

        drawPetals(
          headX, headY, petalR * 1.05, f.petalCount,
          petalLen * 1.05, petalWid * 1.1,
          `hsl(${f.petalHue}, 95%, 50%)`,
          `hsl(${f.petalHue - 6}, 90%, 42%)`,
          time * 0.05 + f.phase,
        );
        drawPetals(
          headX, headY, petalR, f.petalCount,
          petalLen, petalWid,
          `hsl(${f.petalHue + 6}, 100%, 62%)`,
          `hsl(${f.petalHue}, 95%, 52%)`,
          time * 0.05 + f.phase + Math.PI / f.petalCount,
        );
        drawPetals(
          headX, headY, petalR * 0.85, f.petalCount - 4,
          petalLen * 0.7, petalWid * 0.85,
          `hsl(${f.petalHue + 10}, 100%, 72%)`,
          `hsl(${f.petalHue + 4}, 98%, 58%)`,
          time * 0.05 + f.phase + (Math.PI / (f.petalCount - 4)) * 2,
        );

        drawDisk(headX, headY, petalR * 0.85, f.seedCount);

        const gg = ctx.createRadialGradient(headX, headY, 0, headX, headY, petalR + petalLen);
        gg.addColorStop(0, 'rgba(255, 200, 80, 0.15)');
        gg.addColorStop(1, 'rgba(255, 200, 80, 0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gg;
        ctx.fillRect(
          headX - petalR - petalLen,
          headY - petalR - petalLen,
          (petalR + petalLen) * 2,
          (petalR + petalLen) * 2,
        );
        ctx.restore();
      }

      function drawBouquet() {
        const baseX = W / 2;
        const baseY = H + 40;
        const sorted = [...flowers].sort((a, b) => Math.abs(b.angle) - Math.abs(a.angle));
        for (const f of sorted) drawFlower(f, baseX, baseY);
      }

      let lastT = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastT) / 1000, 0.05);
        lastT = now;
        time += dt;
        drawBackground();
        drawParticles();
        drawBouquet();
        requestAnimationFrame(loop);
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function applyState(n, w) {
        flowerCount = n;
        windStrength = w;
        countSlider.value = String(n);
        windSlider.value = String(w);
        countVal.textContent = String(n);
        windVal.textContent = w.toFixed(1);
        flowers = makeFlowers(n);
      }

      countSlider.addEventListener('input', () => {
        const n = parseInt(countSlider.value, 10);
        countVal.textContent = String(n);
        flowerCount = n;
        flowers = makeFlowers(n);
      });
      windSlider.addEventListener('input', () => {
        const w = parseFloat(windSlider.value);
        windVal.textContent = w.toFixed(1);
        windStrength = w;
      });
      document.getElementById('regen').addEventListener('click', () => {
        rng = mulberry32((Date.now() ^ (Math.random() * 1e9)) >>> 0);
        flowers = makeFlowers(flowerCount);
        particles = makeParticles(60);
        showToast('Nuevo ramo generado 🌻');
      });
      document.getElementById('save').addEventListener('click', () => {
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ramo-girasoles-${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Imagen descargada 💾');
        }, 'image/png');
      });
      document.getElementById('share').addEventListener('click', async () => {
        const params = new URLSearchParams({ n: String(flowerCount), w: String(windStrength) });
        const url = `${location.origin}${location.pathname}#${params.toString()}`;
        try {
          if (navigator.share) {
            await navigator.share({ title: 'Ramo de Girasoles', url });
          } else {
            await navigator.clipboard.writeText(url);
            showToast('Link copiado 🔗');
          }
        } catch {
          showToast('Link: ' + url);
        }
      });

      function loadFromUrl() {
        const hash = location.hash.replace(/^#/, '');
        if (!hash) return null;
        const p = new URLSearchParams(hash);
        const n = parseInt(p.get('n') || '', 10);
        const w = parseFloat(p.get('w') || '');
        if (!Number.isFinite(n) || n < 1 || n > 12) return null;
        if (!Number.isFinite(w) || w < 0 || w > 3) return null;
        return { n, w };
      }

      resize();
      const initial = loadFromUrl();
      applyState(initial ? initial.n : 5, initial ? initial.w : 1);
      particles = makeParticles(60);
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
